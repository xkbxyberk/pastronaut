# iOS app and keyboard extension. Generate with: xcodegen generate (from this folder).
# Kept apart from Maccy.xcodeproj so upstream merges never touch iOS files.
name: Pastronaut-iOS
options:
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
packages:
  PastronautCore:
    path: ../PastronautCore
settings:
  base:
    DEVELOPMENT_TEAM: V88QY49A4T
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    # English is the base language; translations live in each target's Localizable.xcstrings.
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Pastronaut:
    type: application
    platform: iOS
    sources:
      - App
      - path: ../Maccy/Acknowledgements.txt
        buildPhase: resources
      # One layered Icon Composer icon for Mac and iOS (Liquid Glass; Xcode renders flat icons for iOS 17-25).
      - path: ../Maccy/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: PastronautCore
      - target: PastronautKeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xkbxyberk.pastronaut
        PRODUCT_NAME: Pastronaut
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [PastronautUITests]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Pastronaut
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/Pastronaut.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers: [iCloud.com.xkbxyberk.pastronaut]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.security.application-groups: [group.com.xkbxyberk.pastronaut]
  PastronautKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard]
    dependencies:
      - package: PastronautCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xkbxyberk.pastronaut.keyboard
        PRODUCT_NAME: PastronautKeyboard
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Pastronaut
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: mul
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/PastronautKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.com.xkbxyberk.pastronaut]
        # Direct fetch and upload with Full Access (Faz 3, KeyboardCloud).
        com.apple.developer.icloud-container-identifiers: [iCloud.com.xkbxyberk.pastronaut]
        com.apple.developer.icloud-services: [CloudKit]
  # Driven step by step by scripts/e2e/sync_e2e.py for the two-device sync test.
  PastronautUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Pastronaut
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xkbxyberk.pastronaut.uitests
        TEST_TARGET_NAME: Pastronaut
        GENERATE_INFOPLIST_FILE: YES
        # XCUIApplication is main-actor isolated; Swift 5 mode keeps the step code plain.
        SWIFT_VERSION: "5.0"
