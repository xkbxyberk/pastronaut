# iOS app and keyboard extension. Generate with: xcodegen generate (from this folder).
# Kept apart from Maccy.xcodeproj so upstream merges never touch iOS files.
name: Pastronaut-iOS
options:
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
packages:
  PastronautCore:
    path: ../PastronautCore
settings:
  base:
    DEVELOPMENT_TEAM: V88QY49A4T
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    # English is the base language; translations live in each target's Localizable.xcstrings.
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "1.0"  # App Store 1.0 (the Mac app on GitHub has its own version, 0.1.0)
    CURRENT_PROJECT_VERSION: "2"
targets:
  Pastronaut:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - Intents
      - path: ../Maccy/Acknowledgements.txt
        buildPhase: resources
      # One layered Icon Composer icon for Mac and iOS (Liquid Glass; Xcode renders flat icons for iOS 17-25).
      - path: ../Maccy/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: PastronautCore
      - target: PastronautKeyboard
      - target: PastronautWidgets
      - target: PastronautShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xkbxyberk.pastronaut
        # iPhone only for the first App Store release; "1,2" brings iPad back once it is tested.
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: Pastronaut
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: [PastronautUITests]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Pastronaut
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # iPad: every orientation, so it can share the screen with other apps (Split View, Stage Manager).
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [remote-notification]
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: Pastronaut can ask for Face ID before showing your clipboard history.
    entitlements:
      path: App/Pastronaut.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers: [iCloud.com.xkbxyberk.pastronaut]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.security.application-groups: [group.com.xkbxyberk.pastronaut]
  PastronautKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Shared]
    dependencies:
      - package: PastronautCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xkbxyberk.pastronaut.keyboard
        # iPhone only for the first App Store release; "1,2" brings iPad back once it is tested.
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: PastronautKeyboard
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Pastronaut
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: mul
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/PastronautKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.com.xkbxyberk.pastronaut]
        # Direct fetch and upload with Full Access (Faz 3, KeyboardCloud).
        com.apple.developer.icloud-container-identifiers: [iCloud.com.xkbxyberk.pastronaut]
        com.apple.developer.icloud-services: [CloudKit]
  # Home and Lock Screen widgets, and the Save Clipboard control (Control Center, Action button).
  PastronautWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Intents
      - Shared
      # Colors used by Shared/ClipVisuals.swift (PinColor, AccentColor, AccentForeground).
      - App/Assets.xcassets
    dependencies:
      - package: PastronautCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xkbxyberk.pastronaut.widgets
        # iPhone only for the first App Store release; "1,2" brings iPad back once it is tested.
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: PastronautWidgets
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Intents shared with the app skip the parts that only the app can run.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Pastronaut
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/PastronautWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.xkbxyberk.pastronaut]
  # Share › Pastronaut: saves shared text or links straight to iCloud.
  PastronautShare:
    type: app-extension
    platform: iOS
    sources: [Share]
    dependencies:
      - package: PastronautCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xkbxyberk.pastronaut.share
        # iPhone only for the first App Store release; "1,2" brings iPad back once it is tested.
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: PastronautShare
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Pastronaut
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: Share/PastronautShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.xkbxyberk.pastronaut]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.xkbxyberk.pastronaut]
        com.apple.developer.icloud-services: [CloudKit]
  # Driven step by step by scripts/e2e/sync_e2e.py for the two-device sync test.
  PastronautUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Pastronaut
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xkbxyberk.pastronaut.uitests
        # iPhone only for the first App Store release; "1,2" brings iPad back once it is tested.
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: Pastronaut
        GENERATE_INFOPLIST_FILE: YES
        # XCUIApplication is main-actor isolated; Swift 5 mode keeps the step code plain.
        SWIFT_VERSION: "5.0"
